name: Image

on:
  push:
    tags: ["v*"]
  # So a version can be built from the branch you dispatch from -- which is
  # how v1.0.0 got an image, the Dockerfile having arrived after that tag.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp and tag the image with, e.g. v1.0.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "value=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # No QEMU: the Dockerfile cross-compiles with Go, so both architectures
      # are built natively on the runner.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/exptechtw/prometheus-render:${{ steps.version.outputs.value }}
            ghcr.io/exptechtw/prometheus-render:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
