name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The renderer fans work out over goroutines, so the race detector earns
      # its keep here.
      - name: Test
        run: go test -race ./...

      # The example gallery is its own module and would otherwise go unbuilt.
      - name: Build the example gallery
        working-directory: examples/gallery
        run: go build ./...

  # Every target the release builds, built on every change, so a tag never
  # fails on a platform nobody had compiled in months.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The version is stamped into the binary, so name it after the commit
      # it was built from rather than a bare "ci".
      - name: Build every target
        run: hack/build-release.sh "ci-$(git rev-parse --short HEAD)"

      - name: Upload the builds
        uses: actions/upload-artifact@v7
        with:
          name: prometheus-render-${{ github.sha }}
          path: dist/
          # The archives are already compressed; zipping them again buys
          # nothing and costs minutes.
          compression-level: 0
          retention-days: 14
