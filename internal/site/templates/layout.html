{{define "head"}}<!doctype html>
<html lang="en" data-up="{{.Up}}" data-interval="{{.Interval}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: light dark;
          --fg:#1a1a1a; --dim:#6a6a6a; --bg:#fff; --rule:#e2e2dd; --link:#0b57a4 }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fg:#e6e6e6; --dim:#9a9a9a; --bg:#16171a; --rule:#2c2f34; --link:#78b4ff }
  }
  :root[data-theme="dark"] { color-scheme: dark;
    --fg:#e6e6e6; --dim:#9a9a9a; --bg:#16171a; --rule:#2c2f34; --link:#78b4ff }
  :root[data-theme="light"] { color-scheme: light }

  * { box-sizing: border-box }
  /* The pages are lettered in the face the drawings are: Maple Mono, cut to
     printable ASCII, 14 KB for the pair and served from the site's own
     directory. A reader who has the full font installed uses theirs. */
  @font-face { font-family:"Maple Mono"; font-style:normal; font-weight:400;
    font-display:swap;
    src:local("Maple Mono NF CN"),local("Maple Mono"),
        url("{{.Up}}fonts/maple-mono-regular.woff2") format("woff2") }
  @font-face { font-family:"Maple Mono"; font-style:normal; font-weight:700;
    font-display:swap;
    src:local("Maple Mono NF CN Bold"),local("Maple Mono Bold"),
        url("{{.Up}}fonts/maple-mono-bold.woff2") format("woff2") }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 "Maple Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  a { color:var(--link) }
  main { padding:1rem 1.25rem 2rem; max-width:1100px; margin:0 auto }

  header, footer { display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
                   padding:.75rem 1.25rem; max-width:1100px; margin:0 auto }
  header { border-bottom:1px solid var(--rule) }
  footer { border-top:1px solid var(--rule); color:var(--dim); font-size:12px }
  footer a { display:inline-flex; align-items:center; gap:.35rem }
  footer svg { width:15px; height:15px; fill:currentColor }
  header b { font-weight:600 }
  header a, footer a { color:inherit; text-decoration:none }
  header a:hover, footer a:hover { text-decoration:underline }
  .spacer { flex:1 }
  .tick { color:var(--dim); font-size:12px }
  button { font:inherit; font-size:12px; color:var(--dim); background:none;
           border:1px solid var(--rule); border-radius:4px; padding:.15rem .5rem; cursor:pointer }
  button:hover, button[aria-pressed="true"] { color:var(--fg) }

  /* The drawings bring their own frame and background, so nothing is wrapped
     around them. A caption line and some air is the whole of it. */
  figure { margin:0 0 1.75rem }
  figcaption { display:flex; align-items:center; gap:.6rem;
               margin-bottom:.35rem; font-size:13px; color:var(--dim) }
  figcaption b { color:var(--fg); font-weight:600 }
  figure img { display:block; max-width:100%; height:auto }

  ul.links { margin:0 0 1.5rem; padding:0; list-style:none;
             display:flex; flex-wrap:wrap; gap:.25rem 1rem }
  ul.links b { color:var(--dim); font-weight:400; margin-right:.25rem }
</style>
<script data-cfasync="false">
  // Set before anything paints, so a dark page never flashes light first.
  try {
    var t = localStorage.getItem('pr.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<header>
  <b><a href="{{.Up}}index.html">{{.SiteTitle}}</a></b>
  <span class="spacer"></span>
  <span class="tick" data-tick></span>
  <button type="button" data-theme-toggle>Dark</button>
</header>
<main>{{end}}

{{define "card"}}
<figure data-key="{{.Key}}" data-variant="plain">
  <figcaption>
    <b><a href="{{.Href}}">{{.Title}}</a></b>
    {{if .Sub}}<span>{{.Sub}}</span>{{end}}
    <span class="spacer"></span>
    {{if .Peak}}<button type="button" data-peak-toggle aria-pressed="false">peak</button>{{end}}
  </figcaption>
  <img alt="{{.Title}}" data-base="{{.Base}}" data-range="{{.Range}}" data-every="{{.Every}}">
</figure>
{{end}}

{{define "foot"}}</main>
<footer>
  <a href="https://github.com/ExpTechTW/prometheus-render" rel="noopener">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    prometheus-render
  </a>
</footer>

<script data-cfasync="false">
(function () {
  var TK = 'pr.theme', VK = 'pr.variant.';
  function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v } catch (e) { return d } }
  function put(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn) }

  var root = document.documentElement;
  var interval = parseInt(root.getAttribute('data-interval') || '0', 10);
  var nextAt = 0;

  // How often one drawing is worth asking for again, and when that next falls
  // due. A plot column is one averaging step wide, so a graph drawn in
  // eight-hour buckets gains a column every eight hours; refetching it every
  // fifteen seconds would spend a request to redraw the same picture. The
  // server skips those passes for the same reason, and every cadence is a
  // whole multiple of the interval, so the two land on the same boundaries
  // without either asking the other.
  function everyOf(img) {
    return parseInt(img.getAttribute('data-every') || '0', 10) || interval;
  }
  function boundaryOf(every) {
    return (Math.floor(Date.now() / 1000 / every) + 1) * every * 1000;
  }

  var dark = false;
  try { dark = matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
  var theme = get(TK, dark ? 'dark' : 'light');

  // Which file an element wants. The palette and the variant choose among
  // drawings the site already holds; the address never carries a version, so
  // the caches in front of it keep their entries.
  function srcFor(img) {
    var box = img.closest('[data-variant]');
    return img.getAttribute('data-base') + '/' + theme + '/' +
           (box ? box.getAttribute('data-variant') : 'plain') + '/' +
           img.getAttribute('data-range') + '.png';
  }

  function chrome() {
    root.setAttribute('data-theme', theme);
    each('[data-theme-toggle]', function (b) { b.textContent = theme === 'dark' ? 'Light' : 'Dark' });
  }

  // Every drawing is fetched and handed to its element as a blob, including
  // the first one -- which is why no <img> carries a src of its own.
  //
  // A browser keeps a second cache for images, above HTTP and keyed by URL,
  // which deliberately ignores expiry: the HTML spec calls it the list of
  // available images and it exists for compatibility. An <img> pointed at a
  // URL it already holds renders from there without a request, and a fetch of
  // that URL fills the HTTP cache, a different store. Going through a blob
  // sidesteps it, while the address on the wire stays put.
  //
  // all fetches every drawing regardless of cadence, which is what a change of
  // palette or of variant needs: those pick a different file, so what is on
  // screen is the wrong one until it is replaced. Otherwise only the drawings
  // whose own boundary has arrived are asked for, and nextAt becomes the
  // soonest of the boundaries left.
  function show(all) {
    var pending = {}, now = Date.now(), soonest = 0;
    each('img[data-base]', function (img) {
      var every = everyOf(img);
      var at = parseInt(img.getAttribute('data-at') || '0', 10);
      var want = all || !at || now >= at;
      if (want && every > 0) {
        at = boundaryOf(every);
        img.setAttribute('data-at', String(at));
      }
      if (at > 0 && (!soonest || at < soonest)) soonest = at;
      if (!want) return;

      var url = srcFor(img);
      var got = pending[url] || (pending[url] = fetch(url, { cache: 'reload' })
        .then(function (r) { return r.ok ? r.blob() : null }));
      got.then(function (blob) {
        if (!blob) return;
        var stale = img.getAttribute('data-blob');
        // One object URL per element: revoking a shared one would blank the
        // others still using it.
        var fresh = URL.createObjectURL(blob);
        img.setAttribute('data-blob', fresh);
        img.src = fresh;
        if (stale) URL.revokeObjectURL(stale);
      }).catch(function () {});
    });
    nextAt = soonest;
  }

  // The countdown is to the soonest drawing on the page, which on a page of
  // one timescale is that timescale's own.
  function tick() {
    if (nextAt && Date.now() >= nextAt) show(false);
    var left = Math.round((nextAt - Date.now()) / 1000);
    var el = document.querySelector('[data-tick]');
    if (!el || left < 0) return;
    var m = Math.floor(left / 60), sec = left % 60;
    el.textContent = 'next in ' + (m > 0 ? m + ':' + (sec < 10 ? '0' : '') + sec : sec + 's');
  }

  // Each drawing remembers its own choice, so it survives following a link.
  each('[data-variant][data-key]', function (box) {
    var v = get(VK + box.getAttribute('data-key'), 'plain');
    box.setAttribute('data-variant', v);
    var b = box.querySelector('[data-peak-toggle]');
    if (b) b.setAttribute('aria-pressed', String(v === 'peak'));
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('[data-theme-toggle]')) {
      theme = theme === 'dark' ? 'light' : 'dark';
      put(TK, theme);
      chrome();
      show(true);
      return;
    }
    var btn = e.target.closest('[data-peak-toggle]');
    if (!btn) return;
    var box = btn.closest('[data-variant]');
    if (!box) return;
    e.preventDefault();
    var v = box.getAttribute('data-variant') === 'peak' ? 'plain' : 'peak';
    box.setAttribute('data-variant', v);
    put(VK + box.getAttribute('data-key'), v);
    btn.setAttribute('aria-pressed', String(v === 'peak'));
    show(true);
  });

  chrome();
  show(true);
  if (interval > 0) {
    tick();
    setInterval(tick, 500);
  }
})();
</script>
</html>
{{end}}
