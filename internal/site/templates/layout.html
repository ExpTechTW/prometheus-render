{{define "head"}}<!doctype html>
<html lang="en" data-up="{{.Up}}" data-version="{{.Version}}" data-interval="{{.Interval}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: light dark;
          --fg:#1a1a1a; --dim:#6a6a6a; --bg:#fff; --panel:#f6f6f4; --rule:#dcdcd6; --link:#0b57a4 }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fg:#e6e6e6; --dim:#9a9a9a; --bg:#16171a; --panel:#1e2024; --rule:#33363c; --link:#78b4ff }
  }
  /* The toggle wins over the system setting, in both directions. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fg:#e6e6e6; --dim:#9a9a9a; --bg:#16171a; --panel:#1e2024; --rule:#33363c; --link:#78b4ff }
  :root[data-theme="light"] { color-scheme: light }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif }
  a { color:var(--link) }
  header, footer { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
                   padding:.9rem 1.25rem; border-bottom:1px solid var(--rule) }
  footer { border-bottom:0; border-top:1px solid var(--rule); color:var(--dim); font-size:12px }
  header h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:.01em }
  header h1 a { color:inherit; text-decoration:none }
  .spacer { flex:1 }
  .gh { display:inline-flex; align-items:center; gap:.4rem; color:var(--dim); text-decoration:none }
  .gh:hover { color:var(--fg) }
  .gh svg { width:18px; height:18px; fill:currentColor }
  .tick { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums }
  button { font:inherit; font-size:12px; color:var(--dim); background:transparent;
           border:1px solid var(--rule); border-radius:5px; padding:.2rem .55rem; cursor:pointer }
  button:hover { color:var(--fg) }
  button[aria-pressed="true"] { color:var(--fg); border-color:var(--fg) }
  main { padding:1.25rem; max-width:1100px; margin:0 auto }
  nav.axes { display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
             margin-bottom:1.5rem }
  nav.axes h2 { margin:0 0 .5rem; font-size:13px; font-weight:600; color:var(--dim);
                text-transform:uppercase; letter-spacing:.06em }
  nav.axes ul { margin:0; padding:0; list-style:none }
  nav.axes li { padding:.15rem 0 }
  /* Graphs carry their own background, so each sits on a plain panel rather
     than being tinted by the page around it. */
  figure { margin:0 0 1.5rem; background:var(--panel);
           border:1px solid var(--rule); border-radius:6px; overflow:hidden }
  figcaption { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
               padding:.5rem .85rem; border-bottom:1px solid var(--rule);
               font-size:13px; font-weight:600 }
  figcaption a { text-decoration:none }
  figcaption a:hover { text-decoration:underline }
  figure img { display:block; max-width:100%; height:auto; padding:.6rem }
  .sub { font-weight:400; color:var(--dim) }
  .crumb { margin:0 0 1rem; color:var(--dim) }
  .empty { color:var(--dim); padding:2rem 0 }
</style>
<script>
  // Set before anything paints, so a dark page never flashes light first.
  try {
    var t = localStorage.getItem('pr.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<header>
  <h1><a href="{{.Up}}index.html">{{.SiteTitle}}</a></h1>
  <span class="spacer"></span>
  <span class="tick" data-tick></span>
  <button type="button" data-theme-toggle>Dark</button>
  <a class="gh" href="https://github.com/ExpTechTW/prometheus-render"
     rel="noopener" title="prometheus-render on GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    prometheus-render
  </a>
</header>
<main>{{end}}

{{define "card"}}
<figure data-key="{{.Key}}" data-variant="plain">
  <figcaption>
    <a href="{{.Href}}">{{.Title}}</a>
    {{if .Sub}}<span class="sub">{{.Sub}}</span>{{end}}
    <span class="spacer"></span>
    {{if .Peak}}<button type="button" data-peak-toggle aria-pressed="false">peak</button>{{end}}
  </figcaption>
  <a href="{{.Href}}"><img alt="{{.Title}}"
     data-base="{{.Base}}" data-range="{{.Range}}"
     src="{{.Base}}/light/plain/{{.Range}}.png"></a>
</figure>
{{end}}

{{define "foot"}}</main>
<footer>
  Updated {{.Now}} by
  <a href="https://github.com/ExpTechTW/prometheus-render" rel="noopener">prometheus-render</a>.
</footer>
<script>
(function () {
  var TK = 'pr.theme', VK = 'pr.variant.';
  function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v } catch (e) { return d } }
  function put(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn) }

  var root = document.documentElement;
  var up = root.getAttribute('data-up') || '';
  var version = root.getAttribute('data-version') || '';
  var interval = parseInt(root.getAttribute('data-interval') || '0', 10);
  var nextAt = interval > 0 ? (parseInt(version, 10) + interval) * 1000 : 0;

  var dark = false;
  try { dark = matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
  var theme = get(TK, dark ? 'dark' : 'light');

  // Image URLs are stable, so every cache in front of them keeps working. What
  // an open page lacks is any reason to ask again: an <img> is fetched once and
  // then sits there, however short its freshness. The poll below supplies that
  // reason, and only when there is actually a new drawing.
  function srcFor(img) {
    var box = img.closest('[data-variant]');
    var v = box ? box.getAttribute('data-variant') : 'plain';
    return img.getAttribute('data-base') + '/' + theme + '/' + v + '/' +
           img.getAttribute('data-range') + '.png';
  }

  function paint() {
    root.setAttribute('data-theme', theme);
    each('[data-theme-toggle]', function (b) { b.textContent = theme === 'dark' ? 'Light' : 'Dark' });
    each('img[data-base]', function (img) {
      var src = srcFor(img);
      if (img.getAttribute('src') !== src) img.setAttribute('src', src);
    });
  }

  // Warm the browser's own cache first, then re-point at the same URLs. The
  // fetches are ordinary and conditional, so an unchanged picture costs a 304
  // and the edge answers most of them; re-pointing then shows what arrived
  // without a second request.
  function refresh() {
    var imgs = [];
    each('img[data-base]', function (img) { imgs.push(img) });
    Promise.all(imgs.map(function (img) {
      return fetch(srcFor(img)).catch(function () {});
    })).then(function () {
      imgs.forEach(function (img) {
        var src = srcFor(img);
        img.removeAttribute('src');
        img.setAttribute('src', src);
      });
    });
  }

  // Each drawing remembers its own choice, so it survives following a link.
  each('[data-variant][data-key]', function (box) {
    var v = get(VK + box.getAttribute('data-key'), 'plain');
    box.setAttribute('data-variant', v);
    var b = box.querySelector('[data-peak-toggle]');
    if (b) b.setAttribute('aria-pressed', String(v === 'peak'));
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('[data-theme-toggle]')) {
      theme = theme === 'dark' ? 'light' : 'dark';
      put(TK, theme);
      paint();
      return;
    }
    var btn = e.target.closest('[data-peak-toggle]');
    if (!btn) return;
    var box = btn.closest('[data-variant]');
    if (!box) return;
    e.preventDefault();
    var v = box.getAttribute('data-variant') === 'peak' ? 'plain' : 'peak';
    box.setAttribute('data-variant', v);
    put(VK + box.getAttribute('data-key'), v);
    btn.setAttribute('aria-pressed', String(v === 'peak'));
    paint();
  });

  paint();
  tick();
  poll();
  setInterval(tick, 1000);
  if (interval > 0) setInterval(poll, 15000);
})();
</script>
</html>
{{end}}
