{{template "head" .}}
{{range .Images}}
<figure data-key="{{$.Key}}/{{.Range}}" data-variant="plain">
  <figcaption>
    <b>{{.Title}}</b>
    <span class="spacer"></span>
    {{if $.Peak}}<button type="button" data-peak-toggle aria-pressed="false">peak</button>{{end}}
  </figcaption>
  <img alt="{{.Title}}" data-base="{{$.Base}}" data-range="{{.Range}}">
</figure>
{{end}}
{{template "foot" .}}
